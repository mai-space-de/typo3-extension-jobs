services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiJobs\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  Maispace\MaiJobs\Indexer\JobsIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'

  Maispace\MaiJobs\Property\TypeConverter\CvUploadTypeConverter:
    tags:
      - name: extbase.type_converter
        priority: 10
        target: TYPO3\CMS\Extbase\Domain\Model\FileReference
        sources: TYPO3\CMS\Core\Http\UploadedFile, array
