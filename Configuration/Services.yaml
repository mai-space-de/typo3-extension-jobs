services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiJobs\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # DataHandler instantiates hooks via GeneralUtility::makeInstance() — must be public for DI
  Maispace\MaiJobs\Hook\JobCacheInvalidationHook:
    public: true

  Maispace\MaiJobs\Indexer\JobsIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'

  Maispace\MaiJobs\Property\TypeConverter\CvUploadTypeConverter:
    tags:
      - name: extbase.type_converter
        priority: 10
        target: TYPO3\CMS\Extbase\Domain\Model\FileReference
        sources: TYPO3\CMS\Core\Http\UploadedFile, array

  dashboard.widget.maiJobsManual:
    class: 'ProudNerds\PnBackendManual\Widgets\ManualWidget'
    arguments:
      $options:
        file: 'EXT:mai_jobs/Resources/Private/Manual/Manual.md'
        numbered: true
        contentsDepth: 2
        printButton: true
    tags:
      - name: dashboard.widget
        identifier: 'maiJobsManual'
        groupNames: 'documentation'
        title: 'Handbuch: Stellen'
        description: 'Kurze Anleitung für Stellenanzeigen und Bewerbungen.'
        iconIdentifier: 'content-book'
        height: 'medium'
        width: 'medium'
